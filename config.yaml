server:
  address: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 10s

database:
  dsn: "imagesafety.db?_busy_timeout=5000&_journal_mode=WAL"

storage:
  directory: "./data/images"
  max_image_bytes: 10485760

moderation:
  model_path: "./models/image-safety-classifier-xs.onnx"
  runtime_library: "./runtime/libonnxruntime.so.1.29.0"
  timeout: 30s
  threads: 2

policy:
  nsfw_threshold: 0.5
  nsfl_threshold: 0.5

worker:
  poll_interval: 250ms

logging:
  level: "info"
